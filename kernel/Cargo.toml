[package]
name = "kernel"
version = "0.1.0"
edition = "2021"
description = "OuroOS kernel, dual-arch (riscv64 / loongarch64), built on PolyHAL"

[dependencies]
polyhal = { version = "0.4.0", features = ["trap", "logger"] }
polyhal-boot = "0.4.0"
polyhal-trap = "0.4.0"
log = "0.4"
spin = { version = "0.10", features = ["mutex"] }
buddy_system_allocator = "0.11"

virtio-drivers = { version = '=0.7.5', default-features = false, features = ['alloc'] }
ext4_rs = '=1.3.3'
fatfs = { git = 'https://github.com/rafalh/rust-fatfs', rev = '38b3a7950bf0e765e34286d1dfe76c519ee347e2', default-features = false, features = ['alloc', 'lfn'] }

[features]
# 调试锁（sync.rs）：持锁深度、切换点断言、等待即报告。
# 挂 feature 而非 debug_assertions：本项目默认只编 release，
# feature 可叠加在 release/selftest 构建上（见 Makefile selftest 目标）。
lock_debug = []
