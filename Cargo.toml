[workspace]
resolver = "2"
members = ["kernel"]
exclude = ["third_party/rsext4"]

# 本地 vendor 的 polyhal 与 polyhal-trap：rv 时钟频率改读设备树，并修复
# EscapeReason 有损、la 未分类异常 panic、la 缺 from_user。修改清单见
# third_party/polyhal*/README.md 与 docs/ostd-contracts.md 缺陷表；不得编辑 registry 源码。
[patch.crates-io]
polyhal = { path = "third_party/polyhal" }
polyhal-trap = { path = "third_party/polyhal-trap" }

# selftest 专用构建档：release 优化 + debug 断言，
# 让 cfg(debug_assertions) 的 OOM 注入等自检进入验证流程。
# profile 必须写在 workspace 根（cargo 限制）。
[profile.selftest]
inherits = "release"
debug-assertions = true
