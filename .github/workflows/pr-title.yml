# 工作 PR 和发布 PR 的标题约定见 CONTRIBUTING.md 第 4、6 节。
name: PR 标题检查

on:
  pull_request:
    branches: [dev, main]
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: 检查标题
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.ref }}
          LC_ALL: C.UTF-8
        run: |
          if [[ "$BASE" == main ]]; then
            pattern='^release: '
            format='release: <阶段说明>'
          else
            types='feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert'
            scope='[a-z][a-z0-9]*(-[a-z0-9]+)*'
            pattern="^($types)(\\($scope\\))?: "
            format='<type>(<scope>): <简述> 或 <type>: <简述>'
          fi

          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::标题格式应为 $format"
            exit 1
          fi
          summary=${TITLE#*: }
          if (( ${#summary} == 0 || ${#summary} > 50 )) ||
             [[ "$summary" =~ ^[[:space:]]|[[:space:]。.]$ ]]; then
            echo "::error::简述须为 1 到 50 个字符，首尾不留空白，末尾不加句号"
            exit 1
          fi
