[package]
name = "user"
version = "0.1.0"
edition = "2021"
description = "OuroOS 用户程序（smoke / check / sched / ill / official_init），双架构静态 ELF，由内核内嵌运行"

# 独立于内核 workspace：由顶层 Makefile 先构建，再嵌入内核镜像
[workspace]

[lib]
name = "user"
path = "src/lib.rs"

[[bin]]
name = "smoke"
path = "src/bin/smoke.rs"

[[bin]]
name = "check"
path = "src/bin/check.rs"
